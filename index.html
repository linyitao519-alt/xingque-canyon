<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星阙峡谷 · 原型</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#17302f">
<style>
  html, body { margin: 0; height: 100%; background: #17302f; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #gl { position: absolute; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  #fps { position: fixed; left: 50%; bottom: 3px; transform: translateX(-50%); padding: 1px 8px; border-radius: 6px; background: rgba(0,0,0,.45); color: #d8f5e6; font: 10px/1.5 ui-monospace, Menlo, monospace; pointer-events: none; white-space: nowrap; }
  #swap img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; pointer-events: none; }
  #swap { display: none; align-items: center; gap: 5px; position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); top: 37vh; padding: 3px 11px 3px 4px; border-radius: 16px; border: 1px solid rgba(255,233,168,.7); background: rgba(10,26,30,.72); color: #ffe9a8; font: 600 12px/1.2 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #pick { display: none; position: fixed; inset: 0; z-index: 5; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vh; background: rgba(8,20,24,.9); color: #e6f3ef; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .pick-title { font-weight: 700; font-size: 5.2vh; letter-spacing: .2em; }
  .pick-row { display: flex; gap: 1.2vw; padding: 0 2vw; max-width: 100vw; }
  .pick-card { all: unset; box-sizing: border-box; width: 14.6vw; padding: 1.4vh .8vw 1.8vh; border-radius: 1.6vh; border: 2px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); display: flex; flex-direction: column; align-items: center; gap: .7vh; text-align: center; cursor: pointer; }
  .pick-card.on { border-color: var(--hc); background: rgba(255,255,255,.1); }
  .pick-card:active { transform: scale(.97); }
  .pick-card img { height: 30vh; max-width: 100%; object-fit: contain; pointer-events: none; }
  .pick-card b { font-size: 4.2vh; color: var(--hc); }
  .pick-card i { font-style: normal; font-size: 2.7vh; color: #a9c7bf; }
  .pick-card span { font-size: 2.6vh; color: #ffe9a8; }
  .pick-card em { font-style: normal; font-size: 2.3vh; line-height: 1.45; color: #cfe0db; }
  #note { display: none; position: fixed; left: 8px; bottom: 6px; max-width: 70vw; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.55); color: #ffd9cf; font: 11px/1.4 system-ui, sans-serif; pointer-events: none; }
  #game { position: absolute; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  #safe { position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    background: rgba(10, 26, 30, .94); color: #e6f3ef; font: 600 20px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; text-align: center; }
  #rotate small { font-weight: 400; font-size: 14px; color: #a9c7bf; }
  #err { display: none; position: fixed; inset: 0; padding: 24px; color: #ffd9cf; background: #17302f; white-space: pre-wrap;
    font: 16px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="game"></canvas>
<div id="note"></div>
<button id="swap">换英雄</button>
<div id="pick"></div>
<div id="fps"></div>
<div id="safe"></div>
<div id="rotate">请把手机横过来<small>星阙峡谷需要横屏游玩（对局已暂停）</small></div>
<div id="err"></div>
<script src="lib/three.min.js"></script>
<script type="module" src="dist/main.js"></script>
</body>
</html>
